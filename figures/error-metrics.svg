<svg xmlns="http://www.w3.org/2000/svg" width="920" height="301" viewBox="0 0 920 301" role="img" aria-labelledby="title desc">
<title id="title">Which error metrics the rows carry, by where they came from</title>
<desc id="desc">Imported from VarBench (430 rows): Error bar and variance 236, Error bar only 29, Variance only 160, Neither found (○ in the leaderboard) 5; Added since from the literature (499 rows): Error bar and variance 59, Error bar only 263, Variance only 3, Neither found (○ in the leaderboard) 174</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}</style>
<rect width="920" height="301" rx="8" fill="#fcfcfb"/>
<text x="28" y="38" font-size="17" fill="#0b0b0b" font-weight="600">Which error metrics the rows carry, by where they came from</text>
<text x="28" y="62" font-size="13" fill="#52514e">92% of the rows imported from VarBench carry an energy variance; 12% of the rows added since from papers do. Exact rows</text>
<text x="28" y="81" font-size="13" fill="#52514e">are left out: they have no error to report.</text>
<rect x="30" y="106" width="10" height="10" rx="2" fill="#2a78d6"/>
<text x="48" y="115" font-size="12" fill="#52514e">Error bar and variance</text>
<rect x="212.08" y="106" width="10" height="10" rx="2" fill="#eb6834"/>
<text x="230.1" y="115" font-size="12" fill="#52514e">Error bar only</text>
<rect x="341.6" y="106" width="10" height="10" rx="2" fill="#1baf7a"/>
<text x="359.6" y="115" font-size="12" fill="#52514e">Variance only</text>
<rect x="464.16" y="106" width="10" height="10" rx="2" fill="#898781"/>
<text x="482.2" y="115" font-size="12" fill="#52514e">Neither found (○ in the leaderboard)</text>
<text x="28" y="152" font-size="13" fill="#0b0b0b">Imported from VarBench</text>
<text x="28" y="169" font-size="12" fill="#898781" style="font-variant-numeric:tabular-nums">430 rows</text>
<rect x="268" y="141" width="340.5" height="24" fill="#2a78d6"/>
<text x="438.2" y="157" font-size="11.5" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric:tabular-nums">55%</text>
<rect x="610.5" y="141" width="40.1" height="24" fill="#eb6834"/>
<text x="630.5" y="157" font-size="11.5" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric:tabular-nums">7%</text>
<rect x="652.6" y="141" width="230.2" height="24" fill="#1baf7a"/>
<text x="767.7" y="157" font-size="11.5" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric:tabular-nums">37%</text>
<path d="M884.7 141H888A4 4 0 0 1 892 145V161A4 4 0 0 1 888 165H884.7Z" fill="#898781"/>
<text x="28" y="210" font-size="13" fill="#0b0b0b">Added since from the literature</text>
<text x="28" y="227" font-size="12" fill="#898781" style="font-variant-numeric:tabular-nums">499 rows</text>
<rect x="268" y="199" width="71.8" height="24" fill="#2a78d6"/>
<text x="303.9" y="215" font-size="11.5" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric:tabular-nums">12%</text>
<rect x="341.8" y="199" width="326.9" height="24" fill="#eb6834"/>
<text x="505.2" y="215" font-size="11.5" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric:tabular-nums">53%</text>
<rect x="670.7" y="199" width="1.8" height="24" fill="#1baf7a"/>
<path d="M674.4 199H888A4 4 0 0 1 892 203V219A4 4 0 0 1 888 223H674.4Z" fill="#898781"/>
<text x="783.2" y="215" font-size="11.5" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric:tabular-nums">35%</text>
<text x="28" y="261" font-size="11.5" fill="#898781">Bars are shares of each source's rows. A deterministic energy (DMRG at a stated bond dimension) needs no error bar to hold a record; a sampled</text>
<text x="28" y="277" font-size="11.5" fill="#898781">one does.</text>
</svg>
