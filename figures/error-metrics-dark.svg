<svg xmlns="http://www.w3.org/2000/svg" width="920" height="301" viewBox="0 0 920 301" role="img" aria-labelledby="title desc">
<title id="title">Which error metrics the rows carry, by where they came from</title>
<desc id="desc">Imported from VarBench (427 rows): Error bar and variance 231, Error bar only 30, Variance only 160, Neither found (○ in the leaderboard) 6; Added since from the literature (614 rows): Error bar and variance 111, Error bar only 292, Variance only 17, Neither found (○ in the leaderboard) 194</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}</style>
<rect width="920" height="301" rx="8" fill="#1a1a19"/>
<text x="28" y="38" font-size="17" fill="#ffffff" font-weight="600">Which error metrics the rows carry, by where they came from</text>
<text x="28" y="62" font-size="13" fill="#c3c2b7">92% of the rows imported from VarBench carry an energy variance; 21% of the rows added since from papers do. Exact rows</text>
<text x="28" y="81" font-size="13" fill="#c3c2b7">are left out: they have no error to report.</text>
<rect x="30" y="106" width="10" height="10" rx="2" fill="#3987e5"/>
<text x="48" y="115" font-size="12" fill="#c3c2b7">Error bar and variance</text>
<rect x="212.08" y="106" width="10" height="10" rx="2" fill="#d95926"/>
<text x="230.1" y="115" font-size="12" fill="#c3c2b7">Error bar only</text>
<rect x="341.6" y="106" width="10" height="10" rx="2" fill="#199e70"/>
<text x="359.6" y="115" font-size="12" fill="#c3c2b7">Variance only</text>
<rect x="464.16" y="106" width="10" height="10" rx="2" fill="#898781"/>
<text x="482.2" y="115" font-size="12" fill="#c3c2b7">Neither found (○ in the leaderboard)</text>
<text x="28" y="152" font-size="13" fill="#ffffff">Imported from VarBench</text>
<text x="28" y="169" font-size="12" fill="#898781" style="font-variant-numeric:tabular-nums">427 rows</text>
<rect x="268" y="141" width="335.6" height="24" fill="#3987e5"/>
<text x="435.8" y="157" font-size="11.5" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric:tabular-nums">54%</text>
<rect x="605.6" y="141" width="41.8" height="24" fill="#d95926"/>
<text x="626.5" y="157" font-size="11.5" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric:tabular-nums">7%</text>
<rect x="649.4" y="141" width="231.8" height="24" fill="#199e70"/>
<text x="765.3" y="157" font-size="11.5" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric:tabular-nums">37%</text>
<path d="M883.2 141H888A4 4 0 0 1 892 145V161A4 4 0 0 1 888 165H883.2Z" fill="#898781"/>
<text x="28" y="210" font-size="13" fill="#ffffff">Added since from the literature</text>
<text x="28" y="227" font-size="12" fill="#898781" style="font-variant-numeric:tabular-nums">614 rows</text>
<rect x="268" y="199" width="110.8" height="24" fill="#3987e5"/>
<text x="323.4" y="215" font-size="11.5" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric:tabular-nums">18%</text>
<rect x="380.8" y="199" width="294.8" height="24" fill="#d95926"/>
<text x="528.2" y="215" font-size="11.5" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric:tabular-nums">48%</text>
<rect x="677.6" y="199" width="15.3" height="24" fill="#199e70"/>
<path d="M694.8 199H888A4 4 0 0 1 892 203V219A4 4 0 0 1 888 223H694.8Z" fill="#898781"/>
<text x="793.4" y="215" font-size="11.5" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric:tabular-nums">32%</text>
<text x="28" y="261" font-size="11.5" fill="#898781">Bars are shares of each source's rows. A deterministic energy (DMRG at a stated bond dimension) needs no error bar to hold a record; a sampled</text>
<text x="28" y="277" font-size="11.5" fill="#898781">one does.</text>
</svg>
