<svg xmlns="http://www.w3.org/2000/svg" width="920" height="301" viewBox="0 0 920 301" role="img" aria-labelledby="title desc">
<title id="title">Which error metrics the rows carry, by where they came from</title>
<desc id="desc">Imported from VarBench (432 rows): Error bar and variance 236, Error bar only 23, Variance only 166, Neither found (○ in the leaderboard) 7; Added since from the literature (496 rows): Error bar and variance 45, Error bar only 272, Variance only 2, Neither found (○ in the leaderboard) 177</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}</style>
<rect width="920" height="301" rx="8" fill="#1a1a19"/>
<text x="28" y="38" font-size="17" fill="#ffffff" font-weight="600">Which error metrics the rows carry, by where they came from</text>
<text x="28" y="62" font-size="13" fill="#c3c2b7">93% of the rows imported from VarBench carry an energy variance; 9% of the rows added since from papers do. Exact rows are</text>
<text x="28" y="81" font-size="13" fill="#c3c2b7">left out: they have no error to report.</text>
<rect x="30" y="106" width="10" height="10" rx="2" fill="#3987e5"/>
<text x="48" y="115" font-size="12" fill="#c3c2b7">Error bar and variance</text>
<rect x="212.08" y="106" width="10" height="10" rx="2" fill="#d95926"/>
<text x="230.1" y="115" font-size="12" fill="#c3c2b7">Error bar only</text>
<rect x="341.6" y="106" width="10" height="10" rx="2" fill="#199e70"/>
<text x="359.6" y="115" font-size="12" fill="#c3c2b7">Variance only</text>
<rect x="464.16" y="106" width="10" height="10" rx="2" fill="#898781"/>
<text x="482.2" y="115" font-size="12" fill="#c3c2b7">Neither found (○ in the leaderboard)</text>
<text x="28" y="152" font-size="13" fill="#ffffff">Imported from VarBench</text>
<text x="28" y="169" font-size="12" fill="#898781" style="font-variant-numeric:tabular-nums">432 rows</text>
<rect x="268" y="141" width="338.9" height="24" fill="#3987e5"/>
<text x="437.4" y="157" font-size="11.5" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric:tabular-nums">55%</text>
<rect x="608.9" y="141" width="31.2" height="24" fill="#d95926"/>
<text x="624.5" y="157" font-size="11.5" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric:tabular-nums">5%</text>
<rect x="642.1" y="141" width="237.8" height="24" fill="#199e70"/>
<text x="761" y="157" font-size="11.5" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric:tabular-nums">38%</text>
<path d="M881.9 141H888A4 4 0 0 1 892 145V161A4 4 0 0 1 888 165H881.9Z" fill="#898781"/>
<text x="28" y="210" font-size="13" fill="#ffffff">Added since from the literature</text>
<text x="28" y="227" font-size="12" fill="#898781" style="font-variant-numeric:tabular-nums">496 rows</text>
<rect x="268" y="199" width="54.6" height="24" fill="#3987e5"/>
<text x="295.3" y="215" font-size="11.5" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric:tabular-nums">9%</text>
<rect x="324.6" y="199" width="340.2" height="24" fill="#d95926"/>
<text x="494.7" y="215" font-size="11.5" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric:tabular-nums">55%</text>
<rect x="666.8" y="199" width="0.5" height="24" fill="#199e70"/>
<path d="M669.3 199H888A4 4 0 0 1 892 203V219A4 4 0 0 1 888 223H669.3Z" fill="#898781"/>
<text x="780.7" y="215" font-size="11.5" fill="#0b0b0b" text-anchor="middle" style="font-variant-numeric:tabular-nums">36%</text>
<text x="28" y="261" font-size="11.5" fill="#898781">Bars are shares of each source's rows. A deterministic energy (DMRG at a stated bond dimension) needs no error bar to hold a record; a sampled</text>
<text x="28" y="277" font-size="11.5" fill="#898781">one does.</text>
</svg>
