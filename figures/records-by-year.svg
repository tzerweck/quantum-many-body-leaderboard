<svg xmlns="http://www.w3.org/2000/svg" width="920" height="377" viewBox="0 0 920 377" role="img" aria-labelledby="title desc">
<title id="title">Standing records by the year their source was published</title>
<desc id="desc">2017: 8, 2018: 0, 2019: 0, 2020: 1, 2021: 6, 2022: 11, 2023: 24, 2024: 0, 2025: 1, 2026: 4</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}</style>
<rect width="920" height="377" rx="8" fill="#fcfcfb"/>
<text x="28" y="38" font-size="17" fill="#0b0b0b" font-weight="600">Standing records by the year their source was published</text>
<text x="28" y="62" font-size="13" fill="#52514e">55 of the 105 variational-held records resolve to a publication year. The other 50 cite a run script and no paper, so they have no</text>
<text x="28" y="81" font-size="13" fill="#52514e">year to plot.</text>
