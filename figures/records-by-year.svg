<text x="28" y="38" font-size="17" fill="#0b0b0b" font-weight="600">Standing records by the year their source was published</text>
<text x="28" y="62" font-size="13" fill="#52514e">81 of 192 records resolve to a publication year. The other 111 cite a run script and no paper, so they have no year to plot.</text>
