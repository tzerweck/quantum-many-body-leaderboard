<svg xmlns="http://www.w3.org/2000/svg" width="920" height="555" viewBox="0 0 920 555" role="img" aria-labelledby="title desc">
<title id="title">The record over time on two frontier instances</title>
<desc id="desc">Energy per site versus publication year for J1-J2 square 10×10, J2 = 0.5 and Hubbard square 16×16, U = 8, n = 0.875.</desc>
