<text x="28" y="513" font-size="11.5" fill="#898781">Not shown: rows with no paper to date them, 6 on J1-J2 square 10×10 and 4 on Hubbard square 16×16 (VarBench's own reference runs). Year is</text>
<text x="28" y="529" font-size="11.5" fill="#898781">the source's publication year. The line steps down only when an eligible row beats the standing record. Each panel has its own vertical scale.</text>
