<svg xmlns="http://www.w3.org/2000/svg" width="920" height="553" viewBox="0 0 920 553" role="img" aria-labelledby="title desc">
<title id="title">The record over time on two frontier instances</title>
<desc id="desc">Relative energy above the current record versus publication year for J1-J2 square 10×10, J2 = 0.5 and Hubbard square 16×16, U = 8, n = 0.875.</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}</style>
<rect width="920" height="553" rx="8" fill="#1a1a19"/>
<text x="28" y="38" font-size="17" fill="#ffffff" font-weight="600">The record over time on two frontier instances</text>
<text x="28" y="62" font-size="13" fill="#c3c2b7">Every dated result, placed by how far its energy per site sits above today's record (relative, log scale). Filled marks can hold</text>
<text x="28" y="81" font-size="13" fill="#c3c2b7">the record; hollow marks are listed but cannot, for want of an error bar or because the row is flagged.</text>
<circle cx="35" cy="111" r="6.5" fill="#1a1a19"/><circle cx="35" cy="111" r="4.5" fill="#3987e5"/>
<text x="48" y="115" font-size="12" fill="#c3c2b7">Variational bound</text>
<circle cx="182.3" cy="111" r="6.5" fill="#1a1a19"/><circle cx="182.3" cy="111" r="4.5" fill="#d95926"/>
<text x="195.3" y="115" font-size="12" fill="#c3c2b7">Projected (fixed-node)</text>
<circle cx="364.4" cy="111" r="6.5" fill="#1a1a19"/><circle cx="364.4" cy="111" r="4.5" fill="#199e70"/>
<text x="377.4" y="115" font-size="12" fill="#c3c2b7">Extrapolated</text>
<circle cx="486.2" cy="111" r="6.5" fill="#1a1a19"/><circle cx="486.2" cy="111" r="4" fill="#1a1a19" stroke="#c3c2b7" stroke-width="2"/>
<text x="499.2" y="115" font-size="12" fill="#c3c2b7">Listed, cannot hold the record</text>
<path d="M707.6 111H721.6" stroke="#c3c2b7" stroke-width="2" stroke-linecap="round"/>
<text x="727.6" y="115" font-size="12" fill="#c3c2b7">Standing record</text>
<text x="28" y="147" font-size="13" fill="#ffffff" font-weight="600">J1-J2 square 10×10, J2 = 0.5</text>
<path d="M78 338.9H432" stroke="#2c2c2a" stroke-width="1"/>
<text x="70" y="342.4" font-size="11" fill="#898781" text-anchor="end">10⁻⁶</text>
<path d="M78 281.8H432" stroke="#2c2c2a" stroke-width="1"/>
<text x="70" y="285.3" font-size="11" fill="#898781" text-anchor="end">10⁻⁵</text>
<path d="M78 224.6H432" stroke="#2c2c2a" stroke-width="1"/>
<text x="70" y="228.1" font-size="11" fill="#898781" text-anchor="end">10⁻⁴</text>
