<title id="title">Standing records by the year their source was published</title>
<desc id="desc">2013: 16, 2014: 0, 2015: 0, 2016: 0, 2017: 8, 2018: 0, 2019: 0, 2020: 1, 2021: 7, 2022: 10, 2023: 30, 2024: 0, 2025: 1, 2026: 4</desc>
