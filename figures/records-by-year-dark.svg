<text x="28" y="38" font-size="17" fill="#ffffff" font-weight="600">Standing records by the year their source was published</text>
<text x="28" y="62" font-size="13" fill="#c3c2b7">77 of the 105 variational-held records resolve to a publication year. The other 28 cite a run script and no paper, so they have no</text>
<text x="28" y="81" font-size="13" fill="#c3c2b7">year to plot.</text>
