<desc id="desc">2013: 12, 2014: 0, 2015: 0, 2016: 0, 2017: 8, 2018: 0, 2019: 0, 2020: 1, 2021: 9, 2022: 11, 2023: 30, 2024: 25, 2025: 3, 2026: 8</desc>
