<text x="94" y="528" font-size="9.5" fill="#898781">exact: −0.503810 (ED), no cost stated, not drawn</text>
<text x="28" y="550" font-size="11.5" fill="#898781">Every mark is an estimate, good to an order of magnitude. Network estimates: iterations × samples × (connected configurations + sampler</text>
<text x="28" y="566" font-size="11.5" fill="#898781">proposals + 3) × forward-pass FLOPs × evaluations per amplitude, stage by stage, from the counts the paper or run script states, with the</text>
<text x="28" y="582" font-size="11.5" fill="#898781">optimizer's solve where the code is known; pre-training is not counted. DMRG estimates: the dense tensor contractions of every sweep in the</text>
<text x="28" y="598" font-size="11.5" fill="#898781">run script's schedule, plus its variance evaluations; the saving from conserved quantum numbers is not counted, so a symmetric code does less</text>
<text x="28" y="614" font-size="11.5" fill="#898781">arithmetic than this. 1 of these estimate needed an assumption (an architecture detail, or a Lanczos count taken from the calibration run).</text>
<text x="28" y="630" font-size="11.5" fill="#898781">Labels marked QMBL are QMBL's own reference runs (7 rows).</text>
