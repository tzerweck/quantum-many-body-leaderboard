<text x="28" y="521" font-size="11.5" fill="#898781">Every mark is an estimate: iterations × samples × (connected configurations + sampler passes + 3) × forward-pass FLOPs, from the counts the</text>
<text x="28" y="537" font-size="11.5" fill="#898781">paper states; the optimizer's solve, symmetry projections and pre-training are not counted, and the model is good to an order of magnitude. 1</text>
<text x="28" y="553" font-size="11.5" fill="#898781">of these estimate needed an assumption about the architecture. Labels marked QMBL are QMBL's own reference runs (3 rows).</text>
