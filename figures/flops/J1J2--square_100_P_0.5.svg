<text x="28" y="1050" font-size="11.5" fill="#898781">Every mark is an estimate, good to an order of magnitude. Network estimates: iterations × samples × (connected configurations + sampler</text>
<text x="28" y="1066" font-size="11.5" fill="#898781">passes + 3) × forward-pass FLOPs, from the counts the paper states; the optimizer's solve, symmetry projections and pre-training are not</text>
<text x="28" y="1082" font-size="11.5" fill="#898781">counted. DMRG estimates: the dense tensor contractions of every sweep in the run script's schedule, plus its variance evaluations; the saving</text>
<text x="28" y="1098" font-size="11.5" fill="#898781">from conserved quantum numbers is not counted, so a symmetric code does less arithmetic than this. 4 of these estimates needed an</text>
<text x="28" y="1114" font-size="11.5" fill="#898781">assumption (an architecture detail, or a Lanczos count taken from the calibration run). Labels marked QMBL are QMBL's own reference runs (7</text>
<text x="28" y="1130" font-size="11.5" fill="#898781">rows).</text>
