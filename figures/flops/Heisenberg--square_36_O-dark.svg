<text x="28" y="898" font-size="11.5" fill="#898781">Every mark is an estimate, good to an order of magnitude. Network estimates: iterations × samples × (connected configurations + sampler</text>
<text x="28" y="914" font-size="11.5" fill="#898781">passes + 3) × forward-pass FLOPs, from the counts the paper states; the optimizer's solve, symmetry projections and pre-training are not</text>
<text x="28" y="930" font-size="11.5" fill="#898781">counted. DMRG estimates: the dense tensor contractions of every sweep in the run script's schedule, plus its variance evaluations; the saving</text>
<text x="28" y="946" font-size="11.5" fill="#898781">from conserved quantum numbers is not counted, so a symmetric code does less arithmetic than this.</text>
