<text x="28" y="502" font-size="11.5" fill="#898781">Every mark is an estimate, good to an order of magnitude. VQE estimates: state-vector gate, metric-tensor and energy-derivative work of the</text>
<text x="28" y="518" font-size="11.5" fill="#898781">run script's natural-gradient schedule. DMRG estimates: the dense tensor contractions of every sweep in the run script's schedule, plus its</text>
<text x="28" y="534" font-size="11.5" fill="#898781">variance evaluations; the saving from conserved quantum numbers is not counted, so a symmetric code does less arithmetic than this. 1 of</text>
<text x="28" y="550" font-size="11.5" fill="#898781">these estimate needed an assumption (an architecture detail, or a Lanczos count taken from the calibration run).</text>
