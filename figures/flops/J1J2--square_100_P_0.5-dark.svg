<text x="489" y="592" font-size="10.5" fill="#c3c2b7" text-anchor="middle">FLOPs, estimated</text>
<text x="28" y="630" font-size="11.5" fill="#898781">Every mark is an estimate, good to an order of magnitude. Network estimates: iterations × samples × (connected configurations + sampler</text>
<text x="28" y="646" font-size="11.5" fill="#898781">proposals + 3) × forward-pass FLOPs × evaluations per amplitude, stage by stage, from the counts the paper or run script states, with the</text>
<text x="28" y="662" font-size="11.5" fill="#898781">optimizer's solve where the code is known; pre-training is not counted. DMRG estimates: the dense tensor contractions of every sweep in the</text>
<text x="28" y="678" font-size="11.5" fill="#898781">run script's schedule, plus its variance evaluations; the saving from conserved quantum numbers is not counted, so a symmetric code does less</text>
<text x="28" y="694" font-size="11.5" fill="#898781">arithmetic than this. 5 of these estimates needed an assumption (an architecture detail, or a Lanczos count taken from the calibration run).</text>
<text x="28" y="710" font-size="11.5" fill="#898781">Labels marked QMBL are QMBL's own reference runs (7 rows).</text>
</svg>
