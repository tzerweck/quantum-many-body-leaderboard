<text x="28" y="507" font-size="11.5" fill="#898781">Every mark is an estimate: iterations × samples × (connected configurations + sampler passes + 3) × forward-pass FLOPs, from the counts the</text>
<text x="28" y="523" font-size="11.5" fill="#898781">paper states; the optimizer's solve, symmetry projections and pre-training are not counted, and the model is good to an order of magnitude. A</text>
<text x="28" y="539" font-size="11.5" fill="#898781">whisker under a mark means an assumption about the architecture was needed (1 row).</text>
