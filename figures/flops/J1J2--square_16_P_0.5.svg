<text x="489" y="464" font-size="10.5" fill="#52514e" text-anchor="middle">FLOPs, estimated</text>
<text x="94" y="480" font-size="9.5" fill="#898781">exact: −0.528620 (ED), no cost stated, not drawn</text>
<text x="28" y="502" font-size="11.5" fill="#898781">Every mark is an estimate, good to an order of magnitude. VQE estimates: state-vector gate, metric-tensor and energy-derivative work of the</text>
<text x="28" y="518" font-size="11.5" fill="#898781">run script's natural-gradient schedule. Network estimates: iterations × samples × (connected configurations + sampler proposals + 3) ×</text>
<text x="28" y="534" font-size="11.5" fill="#898781">forward-pass FLOPs × evaluations per amplitude, stage by stage, from the counts the paper or run script states, with the optimizer's solve</text>
<text x="28" y="550" font-size="11.5" fill="#898781">where the code is known; pre-training is not counted. DMRG estimates: the dense tensor contractions of every sweep in the run script's</text>
<text x="28" y="566" font-size="11.5" fill="#898781">schedule, plus its variance evaluations; the saving from conserved quantum numbers is not counted, so a symmetric code does less arithmetic</text>
<text x="28" y="582" font-size="11.5" fill="#898781">than this. 1 of these estimate needed an assumption (an architecture detail, or a Lanczos count taken from the calibration run). Labels marked</text>
<text x="28" y="598" font-size="11.5" fill="#898781">QMBL are QMBL's own reference runs (4 rows).</text>
