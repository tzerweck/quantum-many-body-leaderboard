<text x="94" y="496" font-size="10" fill="#52514e">1 ViT (factored attention, h = 10, d = 60, b = 2, 4 layers)  ·  2 ViT (decoupled attention, h = 10, d = 60, b = 2, 4 layers)</text>
<text x="28" y="526" font-size="11.5" fill="#898781">Every mark is an estimate, good to an order of magnitude. Network estimates: iterations × samples × (connected configurations + sampler</text>
<text x="28" y="542" font-size="11.5" fill="#898781">passes + 3) × forward-pass FLOPs, from the counts the paper states; the optimizer's solve, symmetry projections and pre-training are not</text>
<text x="28" y="558" font-size="11.5" fill="#898781">counted. DMRG estimates: the dense tensor contractions of every sweep in the run script's schedule, plus its variance evaluations; the saving</text>
<text x="28" y="574" font-size="11.5" fill="#898781">from conserved quantum numbers is not counted, so a symmetric code does less arithmetic than this. 1 of these estimate needed an assumption</text>
<text x="28" y="590" font-size="11.5" fill="#898781">(an architecture detail, or a Lanczos count taken from the calibration run).</text>
