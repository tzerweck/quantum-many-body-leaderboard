<svg xmlns="http://www.w3.org/2000/svg" width="920" height="508" viewBox="0 0 920 508" role="img" aria-labelledby="title desc">
<title id="title">Heisenberg triangular: the best energies at each size</title>
<desc id="desc">periodic: 24 energies at 4 sizes, sizes 16, 36, 108, 144; open: 21 energies at 4 sizes, sizes 100, 144, 196, 256</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}</style>
<rect width="920" height="508" rx="8" fill="#fcfcfb"/>
<text x="28" y="38" font-size="17" fill="#0b0b0b" font-weight="600">Heisenberg triangular: the best energies at each size</text>
<text x="28" y="62" font-size="13" fill="#52514e">2 Hamiltonians, one panel per set of couplings, at every size with a published result. Each size is placed against its exact energy</text>
<text x="28" y="81" font-size="13" fill="#52514e">where it has one (sizes in grey), otherwise against the standing record (sizes in orange), whose holder then sits in the band</text>
<text x="28" y="100" font-size="13" fill="#52514e">above the plot. One line per method family through its best energy at each size; a better energy is higher.</text>
<path d="M28 130H42" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
<text x="48" y="134" font-size="12" fill="#52514e">Best at each size</text>
