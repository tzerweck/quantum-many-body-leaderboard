<title id="title">Hubbard rectangular: the best energies at each size</title>
<desc id="desc">periodic, 4 × L, U = 8, n = 0.875: 32 energies at 2 sizes, sizes 32, 64; periodic/open, 4 × L, U = 8, n = 0.875: 7 energies at 2 sizes, sizes 32, 64</desc>
