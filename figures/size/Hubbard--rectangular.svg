<text x="802.6" y="365.3" font-size="10.5" fill="#52514e">tensor network</text>
<text x="802.6" y="393.8" font-size="10.5" fill="#52514e">backflow / Pfaffian</text>
<text x="28" y="490" font-size="11.5" fill="#898781">Sizes are numbers of sites. A family's line joins its best energy at each size, whichever paper set it, so a line is a family's reach rather than</text>
<text x="28" y="506" font-size="11.5" fill="#898781">one calculation. Where the reference is the record, the heights say how far behind the others are and nothing about the record itself.</text>
