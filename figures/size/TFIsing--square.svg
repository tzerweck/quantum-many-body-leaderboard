<svg xmlns="http://www.w3.org/2000/svg" width="920" height="570" viewBox="0 0 920 570" role="img" aria-labelledby="title desc">
<title id="title">Transverse-field Ising square: the best energies at each size</title>
<desc id="desc">open, h = 3: 12 energies at 2 sizes, sizes 144, 400</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}</style>
<rect width="920" height="570" rx="8" fill="#fcfcfb"/>
<text x="28" y="38" font-size="17" fill="#0b0b0b" font-weight="600">Transverse-field Ising square: the best energies at each size</text>
<text x="28" y="62" font-size="13" fill="#52514e">One Hamiltonian, at every size with a published result. Each size is placed against its exact energy where it has one (sizes in</text>
<text x="28" y="81" font-size="13" fill="#52514e">grey), otherwise against the standing record (sizes in orange), whose holder then sits in the band above the plot. One line per</text>
<text x="28" y="100" font-size="13" fill="#52514e">method family through its best energy at each size; a better energy is higher.</text>
<path d="M28 130H42" stroke="#2a78d6" stroke-width="2" stroke-linecap="round"/>
<text x="48" y="134" font-size="12" fill="#52514e">Best at each size</text>
<path d="M175.28000000000003 130H189.28000000000003" stroke="#898781" stroke-width="2" stroke-linecap="round"/>
<text x="195.3" y="134" font-size="12" fill="#52514e">One method family</text>
<circle cx="337.2" cy="130" r="6.5" fill="#fcfcfb"/><circle cx="337.2" cy="130" r="4.5" fill="#52514e"/>
<text x="350.2" y="134" font-size="12" fill="#52514e">Can hold a record</text>
<circle cx="484.5" cy="130" r="6.5" fill="#fcfcfb"/><circle cx="484.5" cy="130" r="4" fill="#fcfcfb" stroke="#52514e" stroke-width="2"/>
<text x="497.5" y="134" font-size="12" fill="#52514e">Cannot</text>
