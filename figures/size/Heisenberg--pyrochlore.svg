<title id="title">Heisenberg pyrochlore: the best energies at each size</title>
<desc id="desc">24 energies at 6 sizes, sizes 32, 108, 128, 256, 432, 1024</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}</style>
<rect width="920" height="570" rx="8" fill="#fcfcfb"/>
<text x="28" y="38" font-size="17" fill="#0b0b0b" font-weight="600">Heisenberg pyrochlore: the best energies at each size</text>
<text x="28" y="62" font-size="13" fill="#52514e">One Hamiltonian, at every size with a published result. Each size is placed against its exact energy where it has one (sizes in</text>
<text x="28" y="81" font-size="13" fill="#52514e">grey), otherwise against the standing record (sizes in orange), whose holder then sits in the band above the plot. One line per</text>
<text x="28" y="100" font-size="13" fill="#52514e">method family through its best energy at each size; a better energy is higher.</text>
