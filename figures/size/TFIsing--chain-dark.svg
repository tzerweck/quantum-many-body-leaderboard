<text x="732.3" y="250" font-size="10.5" fill="#c3c2b7">tensor network</text>
<text x="732.3" y="404.8" font-size="10.5" fill="#c3c2b7">classic VMC</text>
<text x="28" y="530" font-size="11.5" fill="#898781">Sizes are numbers of sites. A family's line joins its best energy at each size, whichever paper set it, so a line is a family's reach rather than</text>
<text x="28" y="546" font-size="11.5" fill="#898781">one calculation. Where the reference is the record, the heights say how far behind the others are and nothing about the record itself.</text>
