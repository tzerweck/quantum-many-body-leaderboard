<svg xmlns="http://www.w3.org/2000/svg" width="920" height="548" viewBox="0 0 920 548" role="img" aria-labelledby="title desc">
<title id="title">Transverse-field Ising square: the best energies at each size</title>
<desc id="desc">open, h = 3: 12 energies at 2 sizes, sizes 144, 400</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}</style>
<rect width="920" height="548" rx="8" fill="#1a1a19"/>
<text x="28" y="38" font-size="17" fill="#ffffff" font-weight="600">Transverse-field Ising square: the best energies at each size</text>
<text x="28" y="62" font-size="13" fill="#c3c2b7">One Hamiltonian, at every size with a published result. Each size is placed against its exact energy where it has one (sizes in</text>
<text x="28" y="81" font-size="13" fill="#c3c2b7">grey), otherwise against the standing record (sizes in orange), whose holder then sits in the band above the plot. One line per</text>
<text x="28" y="100" font-size="13" fill="#c3c2b7">method family through its best energy at each size; a better energy is higher.</text>
<path d="M28 130H42" stroke="#3987e5" stroke-width="2" stroke-linecap="round"/>
<text x="48" y="134" font-size="12" fill="#c3c2b7">Best at each size</text>
