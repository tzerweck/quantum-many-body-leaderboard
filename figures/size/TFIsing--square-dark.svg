<text x="28" y="508" font-size="11.5" fill="#898781">Sizes are numbers of sites. A family's line joins its best energy at each size, whichever paper set it, so a line is a family's reach rather than</text>
<text x="28" y="524" font-size="11.5" fill="#898781">one calculation. Where the reference is the record, the heights say how far behind the others are and nothing about the record itself.</text>
