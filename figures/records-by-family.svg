<svg xmlns="http://www.w3.org/2000/svg" width="920" height="518" viewBox="0 0 920 518" role="img" aria-labelledby="title desc">
<title id="title">Records by ansatz family</title>
<desc id="desc">RBM: 13 records, 9 contested; tensor network: 29 records, 8 contested; classic VMC: 20 records, 6 contested; AFQMC / GFMC: 26 records, 3 contested; RNN: 4 records, 3 contested; CNN / ResNet: 6 records, 1 contested; backflow / Pfaffian: 5 records, 1 contested; transformer / ViT: 4 records, 1 contested</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}</style>
<rect width="920" height="518" rx="8" fill="#fcfcfb"/>
<text x="28" y="38" font-size="17" fill="#0b0b0b" font-weight="600">Records by ansatz family</text>
<text x="28" y="62" font-size="13" fill="#52514e">Over the 107 records held by a variational bound; the 239 solved instances, where the exact energy is the record, are left out.</text>
<text x="28" y="81" font-size="13" fill="#52514e">Counting every instance rewards whichever method was run on the most easy problems, so the contested bars count only</text>
<text x="28" y="100" font-size="13" fill="#52514e">instances with 5+ published rows, which is where the field is actually competing.</text>
<rect x="30" y="125" width="10" height="10" rx="2" fill="#2a78d6"/>
<text x="48" y="134" font-size="12" fill="#52514e">Records, all unsolved instances</text>
