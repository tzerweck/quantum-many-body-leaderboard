<svg xmlns="http://www.w3.org/2000/svg" width="920" height="446" viewBox="0 0 920 446" role="img" aria-labelledby="title desc">
<title id="title">Heisenberg: Hamiltonians published at one size</title>
<desc id="desc">rectangular 6x8: </desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}</style>
<rect width="920" height="446" rx="8" fill="#1a1a19"/>
<text x="28" y="38" font-size="17" fill="#ffffff" font-weight="600">Heisenberg: Hamiltonians published at one size</text>
<text x="28" y="62" font-size="13" fill="#c3c2b7">Every Hamiltonian of this model with energies published at only one size and no strip to join, grouped where they share lattice,</text>
<text x="28" y="81" font-size="13" fill="#c3c2b7">boundary and size; the coupling or filling that differs between them runs along x. Colour is the kind of number; filled marks can</text>
<text x="28" y="100" font-size="13" fill="#c3c2b7">hold a record, hollow ones cannot, and a slashed mark is a flagged row.</text>
<circle cx="35" cy="130" r="6.5" fill="#1a1a19"/><circle cx="35" cy="130" r="4.5" fill="#3987e5"/>
<text x="48" y="134" font-size="12" fill="#c3c2b7">Variational bound</text>
<circle cx="182.3" cy="130" r="6.5" fill="#1a1a19"/><circle cx="182.3" cy="130" r="4.5" fill="#d95926"/>
<text x="195.3" y="134" font-size="12" fill="#c3c2b7">Projected</text>
<circle cx="286.4" cy="130" r="6.5" fill="#1a1a19"/><circle cx="286.4" cy="130" r="4.5" fill="#199e70"/>
<text x="299.4" y="134" font-size="12" fill="#c3c2b7">Extrapolated</text>
<circle cx="408.2" cy="130" r="6.5" fill="#1a1a19"/><circle cx="408.2" cy="130" r="4.5" fill="#c98500"/>
<text x="421.2" y="134" font-size="12" fill="#c3c2b7">Exact</text>
