<svg xmlns="http://www.w3.org/2000/svg" width="920" height="446" viewBox="0 0 920 446" role="img" aria-labelledby="title desc">
<title id="title">Transverse-field Ising: Hamiltonians published at one size</title>
<desc id="desc">chain, 10 sites, open, h = 1: ; chain, 32 sites, h = 0.5: ; square 6x6, h = 3: </desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}</style>
<rect width="920" height="446" rx="8" fill="#fcfcfb"/>
<text x="28" y="38" font-size="17" fill="#0b0b0b" font-weight="600">Transverse-field Ising: Hamiltonians published at one size</text>
<text x="28" y="62" font-size="13" fill="#52514e">Every Hamiltonian of this model with energies published at only one size and no strip to join, grouped where they share lattice,</text>
<text x="28" y="81" font-size="13" fill="#52514e">boundary and size; the coupling or filling that differs between them runs along x. Colour is the kind of number; filled marks can</text>
<text x="28" y="100" font-size="13" fill="#52514e">hold a record, hollow ones cannot, and a slashed mark is a flagged row.</text>
<circle cx="35" cy="130" r="6.5" fill="#fcfcfb"/><circle cx="35" cy="130" r="4.5" fill="#2a78d6"/>
<text x="48" y="134" font-size="12" fill="#52514e">Variational bound</text>
<circle cx="182.3" cy="130" r="6.5" fill="#fcfcfb"/><circle cx="182.3" cy="130" r="4.5" fill="#eb6834"/>
<text x="195.3" y="134" font-size="12" fill="#52514e">Projected</text>
<circle cx="286.4" cy="130" r="6.5" fill="#fcfcfb"/><circle cx="286.4" cy="130" r="4.5" fill="#1baf7a"/>
<text x="299.4" y="134" font-size="12" fill="#52514e">Extrapolated</text>
<circle cx="408.2" cy="130" r="6.5" fill="#fcfcfb"/><circle cx="408.2" cy="130" r="4.5" fill="#eda100"/>
<text x="421.2" y="134" font-size="12" fill="#52514e">Exact</text>
<circle cx="484.4" cy="130" r="6.5" fill="#fcfcfb"/><circle cx="484.4" cy="130" r="4" fill="#fcfcfb" stroke="#52514e" stroke-width="2"/>
<text x="497.4" y="134" font-size="12" fill="#52514e">Cannot hold a record</text>
