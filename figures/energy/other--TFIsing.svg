<text x="28" y="38" font-size="17" fill="#0b0b0b" font-weight="600">Transverse-field Ising: Hamiltonians published at one size</text>
<text x="28" y="62" font-size="13" fill="#52514e">Every Hamiltonian of this model with energies published at only one size, grouped where they share lattice, boundary and size;</text>
<text x="28" y="81" font-size="13" fill="#52514e">the coupling or filling that differs between them runs along x. Colour is the kind of number; filled marks can hold a record,</text>
<text x="28" y="100" font-size="13" fill="#52514e">hollow ones cannot.</text>
