<text x="28" y="38" font-size="17" fill="#0b0b0b" font-weight="600">Heisenberg triangular: the published energies at each size</text>
<text x="28" y="62" font-size="13" fill="#52514e">One panel per Hamiltonian, at every size with a published energy. Colour is the kind of number; filled marks can hold a record,</text>
<text x="28" y="81" font-size="13" fill="#52514e">hollow ones cannot; the line joins the record at each size.</text>
