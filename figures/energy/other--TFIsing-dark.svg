<title id="title">Transverse-field Ising: Hamiltonians published at one size</title>
<desc id="desc">chain, 10 sites, open, h = 1: ; chain, 32 sites, h = 0.5: ; square 6x6, h = 3: </desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}</style>
<rect width="920" height="424" rx="8" fill="#1a1a19"/>
<text x="28" y="38" font-size="17" fill="#ffffff" font-weight="600">Transverse-field Ising: Hamiltonians published at one size</text>
<text x="28" y="62" font-size="13" fill="#c3c2b7">Every Hamiltonian of this model with energies published at only one size and no strip to join, grouped where they share lattice,</text>
<text x="28" y="81" font-size="13" fill="#c3c2b7">boundary and size; the coupling or filling that differs between them runs along x. Colour is the kind of number; filled marks can</text>
<text x="28" y="100" font-size="13" fill="#c3c2b7">hold a record, hollow ones cannot.</text>
<circle cx="35" cy="130" r="6.5" fill="#1a1a19"/><circle cx="35" cy="130" r="4.5" fill="#3987e5"/>
<text x="48" y="134" font-size="12" fill="#c3c2b7">Variational bound</text>
