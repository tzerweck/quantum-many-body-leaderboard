<title id="title">J1-J2: Hamiltonians published at one size</title>
<desc id="desc">rectangular 4x6, J2 = 0.5: ; square 4x4: 0.05, 0.15, 0.25, 0.35, 0.75, 0.85, 0.95</desc>
