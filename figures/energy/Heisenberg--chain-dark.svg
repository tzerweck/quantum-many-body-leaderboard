<text x="28" y="38" font-size="17" fill="#ffffff" font-weight="600">Heisenberg chain: the published energies at each size</text>
<text x="28" y="62" font-size="13" fill="#c3c2b7">One panel per Hamiltonian, at every size with a published energy. Colour is the kind of number; filled marks can hold a record,</text>
<text x="28" y="81" font-size="13" fill="#c3c2b7">hollow ones cannot; the line joins the record at each size.</text>
