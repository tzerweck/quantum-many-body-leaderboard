<text x="28" y="507" font-size="11.5" fill="#898781">Every mark is GPU-hours; a whisker under a mark means the hours are devices × wall-clock, multiplied here (4 rows) - the stored fields are</text>
<text x="28" y="523" font-size="11.5" fill="#898781">never derived, GPU generations are not normalised, and a CPU core-hour is not converted into a GPU-hour. Projections and extrapolations are</text>
<text x="28" y="539" font-size="11.5" fill="#898781">not bounds and never on the frontier.</text>
