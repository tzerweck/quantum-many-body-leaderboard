<text x="28" y="38" font-size="17" fill="#ffffff" font-weight="600">J1-J2 at J2 = 0.5: what the best results on each lattice cost, in estimated FLOPs</text>
<text x="28" y="62" font-size="13" fill="#c3c2b7">On each size, the results whose cost can be estimated that nothing beats for less on that lattice: sorted by estimated cost,</text>
<text x="28" y="81" font-size="13" fill="#c3c2b7">each is lower in energy than every cheaper one. Energies of different sizes are not compared; each lattice's own figure shows</text>
<text x="28" y="100" font-size="13" fill="#c3c2b7">its frontier with the energies.</text>
