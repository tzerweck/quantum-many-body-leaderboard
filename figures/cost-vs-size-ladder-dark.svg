<text x="28" y="557" font-size="11.5" fill="#898781">GPU-hours are wall-clock from process start to the end of the final evaluation, JIT compilation and sampling included; a DMRG rung's</text>
<text x="28" y="573" font-size="11.5" fill="#898781">core-hours are counted from process start, so each includes the rungs below it. The two units are never converted into each other. Hover a</text>
<text x="28" y="589" font-size="11.5" fill="#898781">mark for its energy. Not drawn: GCNN on 16×16 (2 runs, R-hat 1.27 and 1.38), which finished but whose final evaluation did not equilibrate, so</text>
<text x="28" y="605" font-size="11.5" fill="#898781">under the protocol it is no row.</text>
