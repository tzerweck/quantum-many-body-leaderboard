<text x="28" y="38" font-size="17" fill="#ffffff" font-weight="600">J1-J2 at J2 = 0.5: what QMBL's own runs cost as the lattice grows</text>
<text x="28" y="62" font-size="13" fill="#c3c2b7">One protocol for every size (the same sampler, samples, 2000 steps and final evaluation): each ansatz on one NVIDIA H100 NVL,</text>
<text x="28" y="81" font-size="13" fill="#c3c2b7">DMRG on 8 cores of an AMD EPYC 7763 in rungs of bond dimension. A dot per run.</text>
