<svg xmlns="http://www.w3.org/2000/svg" width="920" height="518" viewBox="0 0 920 518" role="img" aria-labelledby="title desc">
<title id="title">Records by ansatz family</title>
<desc id="desc">tensor network: 32 records, 9 contested; other: 19 records, 8 contested; RBM: 9 records, 6 contested; AFQMC / GFMC: 26 records, 3 contested; classic VMC: 10 records, 2 contested; backflow / Pfaffian: 5 records, 1 contested; CNN / ResNet: 2 records, 1 contested; RNN: 2 records, 1 contested</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}</style>
<rect width="920" height="518" rx="8" fill="#1a1a19"/>
<text x="28" y="38" font-size="17" fill="#ffffff" font-weight="600">Records by ansatz family</text>
<text x="28" y="62" font-size="13" fill="#c3c2b7">Over the 105 records held by a variational bound; the 228 solved instances, where the exact energy is the record, are left out.</text>
<text x="28" y="81" font-size="13" fill="#c3c2b7">Counting every instance rewards whichever method was run on the most easy problems, so the contested bars count only</text>
<text x="28" y="100" font-size="13" fill="#c3c2b7">instances with 5+ published rows, which is where the field is actually competing.</text>
