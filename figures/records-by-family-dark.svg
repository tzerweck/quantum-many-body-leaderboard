<title id="title">Records by ansatz family</title>
<desc id="desc">tensor network: 32 records, 9 contested; classic VMC: 23 records, 9 contested; RBM: 9 records, 6 contested; AFQMC / GFMC: 26 records, 3 contested; RNN: 3 records, 2 contested; CNN / ResNet: 6 records, 1 contested; backflow / Pfaffian: 5 records, 1 contested; other NQS: 1 records, 1 contested</desc>
