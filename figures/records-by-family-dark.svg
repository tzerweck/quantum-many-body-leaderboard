<title id="title">Records by ansatz family</title>
<desc id="desc">tensor network: 44 records, 16 contested; AFQMC / GFMC: 35 records, 7 contested; classic VMC: 17 records, 6 contested; transformer / ViT: 21 records, 4 contested; RNN: 4 records, 3 contested; CNN / ResNet: 22 records, 2 contested; backflow / Pfaffian: 8 records, 2 contested; RBM: 3 records, 1 contested</desc>
