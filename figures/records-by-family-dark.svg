<rect width="920" height="518" rx="8" fill="#1a1a19"/>
<text x="28" y="38" font-size="17" fill="#ffffff" font-weight="600">Records by ansatz family</text>
<text x="28" y="62" font-size="13" fill="#c3c2b7">Over the 154 records on unsolved instances; the 241 solved instances, where the exact energy is the record, are left out.</text>
<text x="28" y="81" font-size="13" fill="#c3c2b7">Counting every instance rewards whichever method was run on the most easy problems, so the contested bars count only</text>
<text x="28" y="100" font-size="13" fill="#c3c2b7">instances with 5+ published rows, which is where the field is actually competing.</text>
