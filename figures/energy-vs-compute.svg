<text x="28" y="568" font-size="11.5" fill="#898781">Record holders, cheapest first: Heisenberg triangular 108 (GCNN, 96 GPU-h, derived); J1-J2 triangular 108, J2 = 0.125 (GCNN + Lanczos step,</text>
<text x="28" y="584" font-size="11.5" fill="#898781">288 GPU-h, derived); J1-J2 triangular 144, J2 = 0.125 (GCNN + Lanczos step, 288 GPU-h, derived); J1-J2 16×16, J2 = 0.55 (GCNN, 300 GPU-h).</text>
<text x="28" y="610" font-size="11.5" fill="#898781">Stored fields are never derived: a row stating "20 A100 for four days" carries those facts and no GPU-hours, and the product is taken here,</text>
<text x="28" y="626" font-size="11.5" fill="#898781">once, and marked. GPU generations are not normalised. 52 further rows state CPU core-hours and are not drawn: CPU and GPU time do not</text>
<text x="28" y="642" font-size="11.5" fill="#898781">share an axis. Filled marks in the size figures mean record-eligible; here they mean GPU-hours as stated.</text>
