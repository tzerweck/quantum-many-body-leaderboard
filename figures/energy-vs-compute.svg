<title id="title">What a published energy cost, against how far it sits from the reference</title>
<desc id="desc">Heisenberg 10×10: 2D minGRU 108 GPU-h, distance 3.0e-5; Heisenberg 16×16: 2D minGRU 696 GPU-h, distance 4.3e-5; Heisenberg triangular 108: GCNN 96 GPU-h (derived), distance 0 (record); Heisenberg triangular 36: Group CNN 12 GPU-h (derived), distance 1.1e-4; Heisenberg triangular 36: 2D RNN wavefunction 1700 GPU-h, distance 7.4e-3; Hubbard 4x16, U = 8: NNBF 800 GPU-h, distance 8.2e-4; Hubbard 4x16, U = 8: NNBF 800 GPU-h, distance 1.8e-3; Hubbard 4x16, U = 8: MLP-NNBF 400 GPU-h, distance 4.8e-3; Hubbard 4x16, U = 8: MLP-NNBF 200 GPU-h, distance 3.7e-3; Hubbard 16×16, U = 8: HFPS + symmetry projection 5000 GPU-h, distance 9.4e-3; J1-J2 10×10, J2 = 0.5: fViT 1920 GPU-h (derived), distance 1.2e-4; J1-J2 10×10, J2 = 0.5: T5 attention 28 GPU-h (derived), distance 1.3e-3; J1-J2 10×10, J2 = 0.5: Decoupled attention 28 GPU-h (derived), distance 1.2e-3; J1-J2 10×10, J2 = 0.5: Factored attention 13 GPU-h (derived), distance 1.0e-3; J1-J2 16×16, J2 = 0.5: GCNN 300 GPU-h, distance 8.2e-4; J1-J2 16×16, J2 = 0.55: GCNN 300 GPU-h, distance 0 (record); J1-J2 6×6, J2 = 0.5: T5 attention 10 GPU-h (derived), distance 1.2e-3; J1-J2 6×6, J2 = 0.5: Decoupled attention 10 GPU-h (derived), distance 1.1e-3; J1-J2 6×6, J2 = 0.5: Factored attention 6 GPU-h (derived), distance 1.2e-3; J1-J2 20×20, J2 = 0.5: ViT with symmetry restoration 25000 GPU-h, distance 1.3e-4; J1-J2 20×20, J2 = 0.5: ViT with Spatial Attention 25000 GPU-h, distance 8.3e-5; J1-J2 triangular 108, J2 = 0.125: GCNN + Lanczos step 288 GPU-h (derived), distance 0 (record); J1-J2 triangular 108, J2 = 0.125: GCNN 288 GPU-h (derived), distance 1.8e-3; J1-J2 triangular 144, J2 = 0.125: GCNN + Lanczos step 288 GPU-h (derived), distance 0 (record); J1-J2 triangular 144, J2 = 0.125: GCNN 288 GPU-h (derived), distance 2.3e-3</desc>
<style>text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}</style>
<rect width="920" height="692" rx="8" fill="#fcfcfb"/>
<text x="28" y="38" font-size="17" fill="#0b0b0b" font-weight="600">What a published energy cost, against how far it sits from the reference</text>
<text x="28" y="62" font-size="13" fill="#52514e">25 energies whose papers state what they cost in GPU-hours (12) or as a device count and a wall-clock (13), on the instances</text>
<text x="28" y="81" font-size="13" fill="#52514e">they were computed for. Distance is from the exact energy where one exists, else from the record; a record holder sits in the</text>
<text x="28" y="100" font-size="13" fill="#52514e">band under the axis.</text>
