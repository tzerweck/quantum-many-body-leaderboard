<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 128" width="640" height="128" role="img" aria-label="QMBL, the quantum many-body leaderboard">
<style>
svg { --ink: #0b0b0b; --muted: #898781; --grid: #e1e0d9; --accent: #2a78d6; }
.name { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; font-size: 46px; font-weight: 600; letter-spacing: 0.02em; fill: var(--ink); }
.sub  { font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; font-size: 15.5px; letter-spacing: 0.1em; text-transform: uppercase; fill: var(--muted); }

.logo { display: inline-block; vertical-align: middle; overflow: visible; }
.logo .dt { fill: var(--ink); animation: logo-dt 12s infinite; }
.logo .hl { fill: none; stroke: var(--ink); stroke-width: 1.2; }
.logo .fr { stroke: var(--grid); stroke-width: 1; stroke-linecap: round;
  animation: logo-fr 4s ease-in-out infinite; animation-delay: var(--d3); }
.logo .nd { transform: rotate(var(--ra)); animation: logo-nd 12s infinite; animation-delay: var(--d); }
.logo .nd line { stroke: var(--accent); stroke-width: 3.2; stroke-linecap: round;
  animation: logo-breathe 3.4s ease-in-out infinite; animation-delay: var(--d2); }
@keyframes logo-nd {
  0%       { opacity: 0; transform: rotate(var(--r0)); animation-timing-function: ease-out; }
  6%       { opacity: 1; transform: rotate(var(--r0)); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  22%, 34% { opacity: 1; transform: rotate(var(--ra)); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  42%, 52% { transform: rotate(var(--rb)); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  60%, 68% { transform: rotate(var(--ra)); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  76%, 86% { transform: rotate(var(--rc)); animation-timing-function: cubic-bezier(.34,1.56,.64,1); }
  92%, 96% { opacity: 1; transform: rotate(var(--ra)); animation-timing-function: ease-in; }
  98%      { opacity: 0; transform: rotate(var(--ra)); }
  100%     { opacity: 0; transform: rotate(var(--r0)); }
}
@keyframes logo-dt { 0% { opacity: .35 } 6%, 96% { opacity: 1 } 98%, 100% { opacity: .35 } }
@keyframes logo-breathe { 0%, 100% { stroke-width: 3.2 } 50% { stroke-width: 2.5 } }
@keyframes logo-fr { 0%, 100% { opacity: .45 } 50% { opacity: 1 } }
@media (prefers-reduced-motion: reduce) { .logo, .logo * { animation: none !important; } }
</style>
<svg class="logo" x="16" y="16" width="96" height="96" viewBox="0 0 32 32" overflow="visible" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" focusable="false">
<line class="fr" x1="6" y1="6" x2="16" y2="6" style="--d3:0s"/>
<line class="fr" x1="6" y1="6" x2="6" y2="16" style="--d3:0s"/>
<line class="fr" x1="16" y1="6" x2="26" y2="6" style="--d3:0.9s"/>
<line class="fr" x1="16" y1="6" x2="16" y2="16" style="--d3:1.3s"/>
<line class="fr" x1="26" y1="6" x2="26" y2="16" style="--d3:2.6s"/>
<line class="fr" x1="6" y1="16" x2="16" y2="16" style="--d3:2.7s"/>
<line class="fr" x1="6" y1="16" x2="6" y2="26" style="--d3:3.9s"/>
<line class="fr" x1="16" y1="16" x2="26" y2="16" style="--d3:3.6s"/>
<line class="fr" x1="16" y1="16" x2="16" y2="26" style="--d3:1.2s"/>
<line class="fr" x1="26" y1="16" x2="26" y2="26" style="--d3:2.5s"/>
<line class="fr" x1="6" y1="26" x2="16" y2="26" style="--d3:1.4s"/>
<line class="fr" x1="16" y1="26" x2="26" y2="26" style="--d3:2.3s"/>
<g transform="translate(6 6)"><g class="nd" style="--r0:98.22deg;--ra:0deg;--rb:90deg;--rc:0deg;--d:0s"><line x1="0" y1="0" x2="10" y2="0" style="--d2:0s"/></g></g>
<g transform="translate(16 16)"><g class="nd" style="--r0:113.31deg;--ra:180deg;--rb:270deg;--rc:90deg;--d:-0.13s"><line x1="0" y1="0" x2="10" y2="0" style="--d2:0.71s"/></g></g>
<g transform="translate(6 26)"><g class="nd" style="--r0:-105deg;--ra:0deg;--rb:0deg;--rc:-90deg;--d:-0.26s"><line x1="0" y1="0" x2="10" y2="0" style="--d2:1.42s"/></g></g>
<g transform="translate(26 6)"><g class="nd" style="--r0:195deg;--ra:90deg;--rb:90deg;--rc:90deg;--d:-0.39s"><line x1="0" y1="0" x2="10" y2="0" style="--d2:2.13s"/></g></g>
<circle class="dt" cx="6" cy="6" r="2.4"/>
<circle class="dt" cx="16" cy="6" r="2.4"/>
<circle class="dt" cx="26" cy="6" r="2.4"/>
<circle class="dt" cx="6" cy="16" r="2.4"/>
<circle class="dt" cx="16" cy="16" r="2.4"/>
<circle class="dt" cx="26" cy="16" r="2.4"/>
<circle class="dt" cx="6" cy="26" r="2.4"/>
<circle class="dt" cx="16" cy="26" r="2.4"/>
<circle class="dt hl" cx="26" cy="26" r="1.8"/>
</svg>
<text class="name" x="136" y="66">QMBL</text>
<text class="sub" x="138" y="92">the quantum many-body leaderboard</text>
</svg>
