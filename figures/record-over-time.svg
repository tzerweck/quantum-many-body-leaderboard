<text x="28" y="62" font-size="13" fill="#52514e">Energy per site of every dated result, by publication year. Filled marks can hold the record; hollow marks are listed but cannot,</text>
<text x="28" y="81" font-size="13" fill="#52514e">for want of an error bar or because the row is flagged.</text>
