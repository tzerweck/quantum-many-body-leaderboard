# Build qmbl.org from data/ and deploy it to GitHub Pages.
#
# The site is generated, never committed: scripts/site.mjs reads data/ and writes _site/,
# with no dependencies, so this workflow needs nothing but a checkout and node. Because
# the deploy is an Actions deploy rather than a branch deploy, a CNAME file in the
# artifact is ignored - the custom domain is set once in the repository's Pages settings.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One deploy at a time, and never cancel one halfway: a cancelled deploy can leave the
# site on a half-published artifact.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate the data
        run: node scripts/validate.mjs
      - name: Build the site
        run: node scripts/site.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
